<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анатомия атласы 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 3D сахна сол жақта, оң жақта анықтама панелі; телефонда панель төменде */
  color-scheme: dark;
  --bg:#0b1220; --stage:#0f1a2e; --panel:#141f33; --line:#25344d;
  --text:#e8eef7; --muted:#93a3ba; --accent:#f2b35e;
  --skin:#d9a98f; --muscle:#b8433c; --bone:#e6dfc4; --organ:#d98a84; --vessel:#cc2a2a; --nerve:#f2cc40;
  --display:"Onest","Segoe UI",system-ui,sans-serif;
  --body:"Golos Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;background:radial-gradient(ellipse at 50% 35%,#1a2b49 0%,var(--stage) 55%,var(--bg) 100%);min-height:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;left:16px;right:16px;top:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;pointer-events:none}
.topbar>*{pointer-events:auto}
h1{font-family:var(--display);font-size:20px;margin:0}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layer{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(11,18,32,.75);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.layer i{width:10px;height:10px;border-radius:50%;display:block}
.layer[aria-pressed="false"]{opacity:.5}
.layer[aria-pressed="false"] i{background:transparent!important;border:1px solid var(--muted)}
.hint{position:absolute;left:16px;bottom:14px;color:var(--muted);font-size:13px;max-width:60%}
.reset{position:absolute;right:16px;bottom:14px;border:1px solid var(--line);background:rgba(11,18,32,.75);border-radius:8px;padding:7px 12px;font-size:13px}
#tip{position:absolute;pointer-events:none;background:#060c17;border:1px solid var(--line);padding:4px 9px;border-radius:6px;font-size:13px;white-space:nowrap;display:none;transform:translate(12px,12px)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:24px;text-align:center}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:14px 8px;font-family:var(--display);font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.scroll{overflow-y:auto;padding:16px;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.row{width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row:hover,.part:hover{border-color:#3d5273}
.row .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row b,.part b{font-weight:600}
.row small{display:block;color:var(--muted);font-size:13px}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:0;font-size:13px}
.back:hover{color:var(--text)}
h2{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.search{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary i{width:9px;height:9px;border-radius:50%;display:block}
summary span{margin-left:auto;font-variant-numeric:tabular-nums}
details>.items{display:flex;flex-direction:column;gap:6px;margin-top:10px}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:600}
.part{width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:block}
.part[aria-expanded="true"]{border-color:var(--accent);background:rgba(242,179,94,.08)}
.part b{display:block}
.part em{display:block;font-style:normal;color:var(--muted);font-size:12.5px}
.part .fn,.part .who{display:none;margin-top:6px;font-size:14px}
.part .who{color:var(--muted);font-size:13px}
.part[aria-expanded="true"] .fn,.part[aria-expanded="true"] .who{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.note a{color:inherit}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:54% 46%}
  .panel{border-left:0;border-top:1px solid var(--line)}
  h1{font-size:17px}.hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="view" aria-label="Адам денесінің 3D моделі"></canvas>
    <div id="msg">Модель жүктелуде…</div>
    <div class="topbar">
      <h1>Анатомия атласы</h1>
      <div class="layers" id="layers"></div>
    </div>
    <div class="hint">Дене бөлігін басыңыз. Айналдыру үшін тартыңыз, жақындату үшін дөңгелекті бұраңыз.</div>
    <button class="reset" id="reset" type="button">Бүкіл денені көрсету</button>
    <div id="tip"></div>
  </div>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-regions" role="tab" type="button" aria-selected="true">11 аймақ</button>
      <button class="tab" id="tab-doctors" role="tab" type="button" aria-selected="false">11 дәрігер</button>
    </div>
    <div class="scroll" id="panel"></div>
  </aside>
</div>

<script>
/* MediCenter: 3 тіл (kk/ru/en) және ата-бетпен көпір. Сөздік — tools/atlas_build.py жасайды. */
(function(){
  var DICT = {"Адам денесінің 3D моделі": ["3D-модель тела человека", "3D model of the human body"], "Тері": ["Кожа", "Skin"], "Бұлшықет": ["Мышцы", "Muscles"], "Қаңқа": ["Скелет", "Skeleton"], "Ішкі мүшелер": ["Внутренние органы", "Internal organs"], "Қан тамырлары": ["Кровеносные сосуды", "Blood vessels"], "Жүйкелер": ["Нервы", "Nerves"], "Бас": ["Голова", "Head"], "Ми, көз, құлақ": ["Мозг, глаза, уши", "Brain, eyes, ears"], "Орталық жүйке жүйесінің басты бөлігі мен негізгі сезім мүшелері орналасқан.": ["Здесь находятся главная часть центральной нервной системы и основные органы чувств.", "Home to the main part of the central nervous system and the main sense organs."], "Мойын": ["Шея", "Neck"], "Бұлшықеттер, кеңірдек": ["Мышцы, трахея", "Muscles, trachea"], "Басты кеудемен жалғайды; тыныс жолы, өңеш, ірі қан тамырлары мен қалқанша без өтеді.": ["Соединяет голову с грудью; здесь проходят дыхательные пути, пищевод, крупные сосуды и щитовидная железа.", "Connects the head to the chest; the airway, oesophagus, large vessels and thyroid gland pass through it."], "Кеуде": ["Грудь", "Chest"], "Жүрек, өкпе": ["Сердце, лёгкие", "Heart, lungs"], "Қабырғалар қорғайтын қуыс: жүрек қан айдайды, өкпе тыныс алуды қамтамасыз етеді.": ["Полость, защищённая рёбрами: сердце качает кровь, лёгкие обеспечивают дыхание.", "A cavity protected by the ribs: the heart pumps blood, the lungs provide breathing."], "Іш": ["Живот", "Abdomen"], "Асқазан, бауыр": ["Желудок, печень", "Stomach, liver"], "Ас қорыту мүшелері орналасқан: тамақ қорытылады, қоректік заттар қанға сіңеді.": ["Здесь расположены органы пищеварения: пища переваривается, питательные вещества всасываются в кровь.", "The digestive organs are here: food is digested and nutrients are absorbed into the blood."], "Бел": ["Поясница", "Lower back"], "Бүйрек": ["Почки", "Kidneys"], "Бел омыртқалары дене салмағын көтереді; екі жағында бүйректер қанды сүзеді.": ["Поясничные позвонки держат вес тела; по бокам почки фильтруют кровь.", "The lumbar vertebrae carry the body's weight; on each side the kidneys filter the blood."], "Жамбас": ["Таз", "Pelvis"], "Қуық, жыныс жүйесі": ["Мочевой пузырь, половая система", "Bladder, reproductive system"], "Жамбас сүйектері қуықты және жыныс мүшелерін қорғайды. Модель ер адам денесі.": ["Тазовые кости защищают мочевой пузырь и половые органы. Модель — мужское тело.", "The pelvic bones protect the bladder and reproductive organs. The model is a male body."], "Оң қол": ["Правая рука", "Right arm"], "Бұлшықет, сүйек": ["Мышцы, кости", "Muscles, bones"], "Иық, тоқпан жілік, білек және қол басы. Ұстау мен нәзік қимылдарды орындайды.": ["Плечо, плечевая кость, предплечье и кисть. Выполняют хват и тонкие движения.", "Shoulder, humerus, forearm and hand. They grip and make fine movements."], "Сол қол": ["Левая рука", "Left arm"], "Оң аяқ": ["Правая нога", "Right leg"], "Сан, тізе, сирақ және аяқ басы. Дене салмағын көтеріп, жүруді қамтамасыз етеді.": ["Бедро, колено, голень и стопа. Держат вес тела и обеспечивают ходьбу.", "Thigh, knee, lower leg and foot. They carry the body's weight and allow walking."], "Сол аяқ": ["Левая нога", "Left leg"], "Арқа": ["Спина", "Back"], "Омыртқа, арқа бұлшықеттері": ["Позвоночник, мышцы спины", "Spine, back muscles"], "Омыртқа жотасы денені тік ұстайды және жұлынды қорғайды; арқа бұлшықеттері қозғалтады.": ["Позвоночник держит тело прямо и защищает спинной мозг; мышцы спины обеспечивают движение.", "The spine keeps the body upright and protects the spinal cord; the back muscles move it."], "Гинеколог": ["Гинеколог", "Gynecologist"], "Әйелдердің жыныс жүйесін қарайды: жатыр, аналық бездер, жатыр түтіктері. Бұл модель ер адам денесі, сондықтан тек жамбас аймағы белгіленеді.": ["Занимается женской половой системой: матка, яичники, маточные трубы. Модель — мужское тело, поэтому отмечается только область таза.", "Treats the female reproductive system: uterus, ovaries, fallopian tubes. The model is a male body, so only the pelvic area is ma agus"], "Ми қатпарларын бір-бірінен бөледі.": ["Отделяет извилины мозга друг от друга.", "Separates the folds of the brain from each other."], "Қолды денеге әкеледі және ішке бұрады.": ["Приводит руку к телу и поворачивает её внутрь.", "Brings the arm to the body and rotates it inward."], "Сілекей бөліп, тамақты ылғалдайды және қорытуды бастайды.": ["Выделяет слюну, увлажняет пищу и начинает пищеварение.", "Produces saliva, moistens food and starts digestion."], "Жиырылып, сүйектерді қозғалтады немесе дене бөлігін бекітеді.": ["Сокращаясь, двигает кости или фиксирует часть тела.", "Contracts to move bones or hold a body part in place."], "Ауаны кеңірдектен өкпе бөліктеріне жеткізеді.": ["Проводит воздух из трахеи к долям лёгких.", "Carries air from the trachea to the lung lobes."], "Білек пен қол басының бүккіш бұлшықеттерін жүйкелендіреді.": ["Иннервирует мышцы-сгибатели предплечья и кисти.", "Supplies the flexor muscles of the forearm and hand."], "Жүректен мүшелерге оттегіге бай қан тасиды.": ["Несёт богатую кислородом кровь от сердца к органам.", "Carries oxygen-rich blood from the heart to the organs."], "Білектің шынашақ жағындағы сүйегі; шынтақ буынын құрайды.": ["Кость предплечья со стороны мизинца; образует локтевой сустав.", "Forearm bone on the little-finger side; forms the elbow joint."], "Ең ірі артерия: жүректен шыққан қанды бүкіл денеге таратады.": ["Самая крупная артерия: разносит кровь от сердца по всему телу.", "The largest artery: distributes blood from the heart to the whole body."], "Ми мен жұлыннан бұлшықеттерге, теріге және мүшелерге сигнал өткізеді.": ["Передаёт сигналы от головного и спинного мозга к мышцам, коже и органам.", "Carries signals from the brain and spinal cord to muscles, skin and organs."], "Мүшелерден қанды жүрекке қайтарады.": ["Возвращает кровь от органов к сердцу.", "Returns blood from the organs to the heart."], "Қозғалыс пен сигналдарды өңдейтін жүйке жасушаларының шоғыры.": ["Скопление нервных клеток, обрабатывающих движения и сигналы.", "A cluster of nerve cells that processes movement and signals."], "Бездің сөлін шығаратын түтік.": ["Проток, выводящий секрет железы.", "A duct that carries a gland's secretion."], "Қолды жанға, алға және артқа көтереді.": ["Поднимает руку в сторону, вперёд и назад.", "Raises the arm to the side, forward and back."], "Аяқты ортаға қарай әкеледі.": ["Приводит ногу к середине тела.", "Brings the leg toward the midline."], "Басқа эндокриндік бездердің жұмысын реттейтін гормондар бөледі.": ["Выделяет гормоны, регулирующие работу других эндокринных желёз.", "Releases hormones that control other endocrine glands."], "Көру, есту немесе тепе-теңдікке қатысады.": ["Участвует в зрении, слухе или равновесии.", "Takes part in vision, hearing or balance."], "Қорқыныш пен эмоцияларды өңдейді.": ["Обрабатывает страх и эмоции.", "Processes fear and emotions."], "Тері денені сыртқы әсерден қорғайды, жылуды реттейді, сезімді қабылдайды.": ["Кожа защищает тело от внешних воздействий, регулирует тепло и воспринимает ощущения.", "Skin protects the body from the outside, regulates heat and senses touch."], "Ми қыртысы ойлау, сезім, қозғалыс пен сөйлеуді басқарады.": ["Кора мозга управляет мышлением, чувствами, движением и речью.", "The cerebral cortex controls thinking, feeling, movement and speech."], "Жүрек пен өкпе арасында қан тасымалдайды.": ["Переносит кровь между сердцем и лёгкими.", "Carries blood between the heart and lungs."], "Денеге тірек болады, мүшелерді қорғайды, бұлшықеттер бекиді.": ["Служит опорой телу, защищает органы, к ней крепятся мышцы.", "Supports the body, protects organs and anchors muscles."], "Жарықты қабылдап, бейнені торқабықта түзеді.": ["Воспринимает свет и формирует изображение на сетчатке.", "Receives light and forms the image on the retina."], "Орталық жүйке жүйесінің бөлігі.": ["Часть центральной нервной системы.", "Part of the central nervous system."], "Ми мен дене арасында сигнал өткізеді; рефлекстерді басқарады.": ["Передаёт сигналы между мозгом и телом; управляет рефлексами.", "Carries signals between the brain and body; controls reflexes."], "Санның алдыңғы бұлшықеттерін жүйкелендіреді.": ["Иннервирует передние мышцы бедра.", "Supplies the front thigh muscles."], "Қолға баратын жүйкелер осы өрімнен шығады.": ["Из этого сплетения выходят нервы руки.", "The nerves of the arm come out of this plexus."], "Беттің сезімталдығын және шайнау бұлшықеттерін қамтамасыз етеді.": ["Обеспечивает чувствительность лица и работу жевательных мышц.", "Gives sensation to the face and works the chewing muscles."], "Тепе-теңдікті сақтайды және қозғалыстарды үйлестіреді.": ["Сохраняет равновесие и координирует движения.", "Keeps balance and coordinates movement."], "Жүрек бұлшықетінің өзін қанмен қамтамасыз етеді.": ["Снабжает кровью саму сердечную мышцу.", "Supplies blood to the heart muscle itself."], "Қанды бастан жүрекке қайтарады.": ["Возвращает кровь от головы к сердцу.", "Returns blood from the head to the heart."], "Жұлын-ми сұйықтығы түзіледі және айналады.": ["Здесь образуется и циркулирует спинномозговая жидкость.", "Cerebrospinal fluid forms and circulates here."], "Қанның кері ағуына жол бермейді.": ["Не даёт крови течь обратно.", "Stops blood from flowing backward."], "Тыныс алу мен жүрек соғуын басқарады; миды жұлынмен байланыстырады.": ["Управляет дыханием и сердцебиением; связывает мозг со спинным мозгом.", "Controls breathing and heartbeat; connects the brain to the spinal cord."], "Жақты алға және жанға жылжытып, шайнауға қатысады.": ["Двигает челюсть вперёд и в стороны, участвует в жевании.", "Moves the jaw forward and sideways; helps chewing."], "Сүйектерді иілгіш түрде жалғайды, пішін береді.": ["Гибко соединяет кости, придаёт форму.", "Joins bones flexibly and gives shape."], "Суды сіңіріп, нәжісті қалыптастырады.": ["Всасывает воду и формирует кал.", "Absorbs water and forms stool."], "Жауырынды қозғалтады, иықты көтереді.": ["Двигает лопатку, поднимает плечо.", "Moves the shoulder blade and raises the shoulder."], "Бас сүйегін ұстап тұрады; басты изеуге мүмкіндік береді.": ["Держит череп; позволяет кивать головой.", "Holds the skull; lets you nod."], "Басты оңға-солға бұруға мүмкіндік береді.": ["Позволяет поворачивать голову вправо-влево.", "Lets you turn the head left and right."], "Қанды оң қарыншадан өкпеге апарады.": ["Несёт кровь из правого желудочка в лёгкие.", "Carries blood from the right ventricle to the lungs."], "Өтті бауыр мен өт қабынан он екі елі ішекке жеткізеді.": ["Доставляет желчь из печени и желчного пузыря в двенадцатиперстную кишку.", "Carries bile from the liver and gallbladder to the duodenum."], "Қабырғаларды алдынан біріктіріп, жүректі қорғайды.": ["Спереди соединяет рёбра и защищает сердце.", "Joins the ribs at the front and protects the heart."], "Қолды қанмен қамтамасыз етеді; қан қысымы осы артерияда өлшенеді.": ["Снабжает кровью руку; на этой артерии измеряют давление.", "Supplies blood to the arm; blood pressure is measured on this artery."], "Шынтақты бүгеді.": ["Сгибает локоть.", "Bends the elbow."], "Балтыр бұлшықетін өкше сүйегіне бекітеді.": ["Прикрепляет икроножную мышцу к пяточной кости.", "Attaches the calf muscle to the heel bone."], "Тұрғанда және жүргенде дене салмағын қабылдайды.": ["Принимает вес тела стоя и при ходьбе.", "Takes the body's weight when standing and walking."], "Білезік буынының икемді қозғалысын қамтамасыз етеді.": ["Обеспечивает гибкие движения запястья.", "Allows flexible wrist movement."], "Жарықты жүйке сигналына айналдырады.": ["Превращает свет в нервный сигнал.", "Turns light into a nerve signal."], "Иықты кеудемен жалғап, қолға тірек болады.": ["Соединяет плечо с грудной клеткой и служит опорой руке.", "Connects the shoulder to the chest and supports the arm."], "Жамбас түбі бұлшықеттері мен байламдары бекиді.": ["К ней крепятся мышцы и связки тазового дна.", "Pelvic floor muscles and ligaments attach here."], "Дыбыс тербелісін жүйке сигналына айналдырады.": ["Превращает звуковые колебания в нервный сигнал.", "Turns sound vibrations into a nerve signal."], "Қол басының ұсақ бұлшықеттерін және шынашақ жағын жүйкелендіреді.": ["Иннервирует мелкие мышцы кисти и сторону мизинца.", "Supplies the small hand muscles and the little-finger side."], "Көздің мөлдір алдыңғы қабаты; жарықты сындырады.": ["Прозрачный передний слой глаза; преломляет свет.", "The clear front layer of the eye; bends light."], "Мидың оң және сол жарты шарларын байланыстырады.": ["Связывает правое и левое полушария мозга.", "Connects the right and left halves of the brain."], "Қабырғаны төс сүйегімен иілгіш түрде жалғайды.": ["Гибко соединяет ребро с грудиной.", "Flexibly joins a rib to the sternum."], "Көмейдің негізін құрайды, кеңірдекпен жалғасады.": ["Образует основание гортани, соединяется с трахеей.", "Forms the base of the larynx and joins the trachea."], "Тірек пен тепе-теңдікті қамтамасыз етеді.": ["Обеспечивает опору и равновесие.", "Provides support and balance."], "Қолдың жазғыш бұлшықеттерін жүйкелендіреді.": ["Иннервирует мышцы-разгибатели руки.", "Supplies the extensor muscles of the arm."], "Аяқты қанмен қамтамасыз ететін негізгі артерия.": ["Основная артерия, снабжающая кровью ногу.", "The main artery supplying blood to the leg."], "Білезік пен саусақтарды бүгеді.": ["Сгибает запястье и пальцы.", "Bends the wrist and fingers."], "Төменгі жақты көтеріп, тамақты шайнайды.": ["Поднимает нижнюю челюсть и пережёвывает пищу.", "Lifts the lower jaw and chews food."], "Негізгі тыныс бұлшықеті: жиырылғанда өкпеге ауа кіреді.": ["Главная дыхательная мышца: при сокращении воздух входит в лёгкие.", "The main breathing muscle: when it contracts, air enters the lungs."], "Саусақтардың қозғалысы мен ұстауды қамтамасыз етеді.": ["Обеспечивает движения пальцев и хват.", "Allows finger movement and gripping."], "Білезікті саусақтармен жалғайды.": ["Соединяет запястье с пальцами.", "Connects the wrist to the fingers."], "Аяқ басының күмбезін құрап, серпін береді.": ["Образует свод стопы и даёт упругость.", "Forms the arch of the foot and gives spring."], "Асқазаннан келген тамақ өт және ұйқы безі сөлімен араласады.": ["Пища из желудка смешивается с желчью и соком поджелудочной железы.", "Food from the stomach mixes with bile and pancreatic juice."], "Жүрек пен өкпені қорғайды; тыныс алғанда кеудені кеңейтеді.": ["Защищают сердце и лёгкие; при вдохе расширяют грудную клетку.", "Protect the heart and lungs; widen the chest when breathing in."], "Бұлшықетті сүйекке бекітеді немесе буынды ұстап тұрады.": ["Прикрепляет мышцу к кости или удерживает сустав.", "Attaches a muscle to bone or holds a joint together."], "Жұтқанда көмейді жауып, тамақтың тыныс жолына түсуіне жол бермейді.": ["При глотании закрывает гортань, чтобы пища не попала в дыхательные пути.", "Closes the larynx when swallowing so food doesn't enter the airway."], "Мұрын қуысының жоғарғы бөлігін құрайды; иіс сезу жүйкелері өтеді.": ["Образует верх полости носа; через неё проходят обонятельные нервы.", "Forms the top of the nasal cavity; the smell nerves pass through it."], "Білезік пен саусақтарды жазады.": ["Разгибает запястье и пальцы.", "Straightens the wrist and fingers."], "Денені бұрады және жанға еңкейтеді.": ["Поворачивает туловище и наклоняет его в сторону.", "Turns the trunk and bends it sideways."], "Миға және бетке оттегіге бай қан жеткізеді.": ["Доставляет богатую кислородом кровь к мозгу и лицу.", "Carries oxygen-rich blood to the brain and face."], "Тыныс алғанда қабырғаларды көтеріп-түсіреді.": ["При дыхании поднимают и опускают рёбра.", "Raise and lower the ribs when breathing."], "Мимика бұлшықеттерін басқарады.": ["Управляет мимическими мышцами.", "Controls the facial expression muscles."], "Денедегі ең ұзын әрі берік сүйек; салмақты тізеге береді.": ["Самая длинная и прочная кость тела; передаёт вес на колено.", "The longest and strongest bone in the body; passes weight to the knee."], "Сирақтың жіңішке сүйегі; тобық буынын тұрақтандырады.": ["Тонкая кость голени; стабилизирует голеностопный сустав.", "The thin lower-leg bone; stabilizes the ankle."], "Мидың маңдай бөлігін және көз ұяларын қорғайды.": ["Защищает лобную часть мозга и глазницы.", "Protects the front of the brain and the eye sockets."], "Өтті жинап, майды қорыту үшін ішекке шығарады.": ["Накапливает желчь и выводит её в кишечник для переваривания жиров.", "Stores bile and releases it into the intestine to digest fat."], "Ішкі мүшелердің жұмысын еріксіз реттейді (жүрек соғуы, тамыр тонусы).": ["Непроизвольно регулирует работу внутренних органов (сердцебиение, тонус сосудов).", "Automatically regulates internal organs (heartbeat, vessel tone)."], "Санды жазады; тұру, жүру, баспалдақпен көтерілуге қатысады.": ["Разгибает бедро; участвует в стоянии, ходьбе, подъёме по лестнице.", "Extends the hip; used in standing, walking and climbing stairs."], "Санды жанға әкетеді, жүргенде жамбасты тұрақтандырады.": ["Отводит бедро в сторону, стабилизирует таз при ходьбе.", "Moves the thigh outward and steadies the pelvis when walking."], "Аяқтың беткей қанын жүрекке қарай жинайды.": ["Собирает поверхностную кровь ноги к сердцу.", "Collects surface blood from the leg toward the heart."], "Ішектен сіңген заттарға бай қанды бауырға әкеледі.": ["Несёт к печени кровь, богатую веществами из кишечника.", "Carries blood rich in nutrients from the intestine to the liver."], "Дене салмағын аяққа береді, жамбас мүшелерін қорғайды.": ["Передаёт вес тела на ноги, защищает органы таза.", "Passes the body's weight to the legs and protects the pelvic organs."], "Жаңа естеліктерді қалыптастырады.": ["Формирует новые воспоминания.", "Forms new memories."], "Иық пен шынтақ арасындағы сүйек; қол бұлшықеттері бекиді.": ["Кость между плечом и локтем; к ней крепятся мышцы руки.", "The bone between shoulder and elbow; arm muscles attach to it."], "Тіл мен көмей бұлшықеттеріне тірек болады.": ["Служит опорой мышцам языка и гортани.", "Supports the muscles of the tongue and larynx."], "Дене температурасын, аштықты, шөлді және гормондарды реттейді.": ["Регулирует температуру тела, голод, жажду и гормоны.", "Regulates body temperature, hunger, thirst and hormones."], "Санды жамбас буынында бүгеді.": ["Сгибает бедро в тазобедренном суставе.", "Bends the thigh at the hip joint."], "Денені тік ұстайды, арқаны жазады.": ["Держит тело прямо, разгибает спину.", "Keeps the body upright and straightens the back."], "Санның сыртқы жағын бекітіп, тізені тұрақтандырады.": ["Укрепляет наружную сторону бедра и стабилизирует колено.", "Strengthens the outer thigh and steadies the knee."], "Дабыл жарғағының тербелісін ішкі құлаққа жеткізеді.": ["Передаёт колебания барабанной перепонки во внутреннее ухо.", "Passes eardrum vibrations to the inner ear."], "Қанды оттегімен байытып, көмірқышқыл газын шығарады.": ["Насыщает кровь кислородом и выводит углекислый газ.", "Adds oxygen to the blood and removes carbon dioxide."], "Қандағы кальций деңгейін реттейді.": ["Регулирует уровень кальция в крови.", "Regulates the calcium level in the blood."], "Көз алмасын бұрады немесе қабақты көтереді.": ["Поворачивает глазное яблоко или поднимает веко.", "Turns the eyeball or lifts the eyelid."], "Денеден оралған қанды жүрекке әкеледі.": ["Приносит вернувшуюся от тела кровь к сердцу.", "Brings blood returning from the body to the heart."], "Иық буынын тұрақтандырып, қолды бұрады.": ["Стабилизирует плечевой сустав и вращает руку.", "Steadies the shoulder joint and rotates the arm."], "Кеуде қабырғасының бұлшықеттері мен терісін жүйкелендіреді.": ["Иннервирует мышцы и кожу грудной стенки.", "Supplies the muscles and skin of the chest wall."], "Қарашықтың көлемін өзгертіп, жарық мөлшерін реттейді.": ["Меняет размер зрачка и регулирует количество света.", "Changes pupil size to control how much light enters."], "Тамақ толық қорытылып, қоректік заттар қанға сіңеді.": ["Пища полностью переваривается, питательные вещества всасываются в кровь.", "Food is fully digested and nutrients are absorbed into the blood."], "Қанды сүзіп, несеп түзеді; су мен тұз тепе-теңдігін сақтайды.": ["Фильтрует кровь и образует мочу; поддерживает баланс воды и солей.", "Filters blood and makes urine; keeps the water and salt balance."], "Сөл немесе гормон бөледі.": ["Выделяет секрет или гормоны.", "Releases secretions or hormones."], "Ауа мен тамақ өтетін жол; жұтуға қатысады.": ["Путь для воздуха и пищи; участвует в глотании.", "The passage for air and food; helps swallowing."], "Өкшені көтереді; жүру мен жүгіруге қажет.": ["Поднимает пятку; нужна для ходьбы и бега.", "Lifts the heel; needed for walking and running."], "Шынтақты жазады.": ["Разгибает локоть.", "Straightens the elbow."], "Қолды артқа және төмен тартады.": ["Тянет руку назад и вниз.", "Pulls the arm back and down."], "Веналардан келген қанды қабылдап, қарыншаға өткізеді.": ["Принимает кровь из вен и передаёт её в желудочек.", "Receives blood from the veins and passes it to the ventricle."], "Иммундық Т-жасушалар осында жетіледі.": ["Здесь созревают иммунные Т-клетки.", "Immune T cells mature here."], "Оттегіге бай қанды қолқа арқылы бүкіл денеге айдайды.": ["Перекачивает богатую кислородом кровь через аорту по всему телу.", "Pumps oxygen-rich blood through the aorta to the whole body."], "Жарықты торқабыққа шоғырландырады.": ["Фокусирует свет на сетчатке.", "Focuses light onto the retina."], "Қанды улы заттардан тазартады, өт бөледі, қоректік заттарды сақтайды.": ["Очищает кровь от токсинов, вырабатывает желчь, запасает питательные вещества.", "Cleans toxins from the blood, makes bile and stores nutrients."], "Шынтақты бүгеді, білекті сыртқа бұрады.": ["Сгибает локоть, поворачивает предплечье наружу.", "Bends the elbow and turns the forearm outward."], "Тізені бүгеді, санды артқа жазады.": ["Сгибает колено, разгибает бедро назад.", "Bends the knee and extends the thigh backward."], "Тамақты тістеп, ұсақтайды. Күрек тіс кеседі, сүйір тіс үзеді, азу тіс үгітеді.": ["Откусывает и измельчает пищу. Резцы режут, клыки рвут, коренные зубы перетирают.", "Bites and breaks down food. Incisors cut, canines tear, molars grind."], "Шайнауға және сөйлеуге қатысады; төменгі тістер орналасқан.": ["Участвует в жевании и речи; в ней расположены нижние зубы.", "Used in chewing and speech; holds the lower teeth."], "Жоғарғы тістерді ұстайды, мұрын қуысы мен көз ұясының қабырғасын құрайды.": ["Держит верхние зубы, образует стенки полости носа и глазницы.", "Holds the upper teeth and forms walls of the nasal cavity and eye socket."], "Мұрын қырын құрайды.": ["Образует спинку носа.", "Forms the bridge of the nose."], "Мидың артқы бөлігін қорғайды; жұлын өтетін үлкен тесігі бар.": ["Защищает заднюю часть мозга; имеет большое отверстие для спинного мозга.", "Protects the back of the brain; has a large opening for the spinal cord."], "Көзден миға көру сигналдарын жеткізеді.": ["Передаёт зрительные сигналы от глаза к мозгу.", "Carries visual signals from the eye to the brain."], "Ерінді жабады және жинайды.": ["Смыкает и собирает губы.", "Closes and purses the lips."], "Ауыз-жұтқыншақ арқылы кіретін микробтардан қорғайды.": ["Защищает от микробов, попадающих через рот и глотку.", "Protects against germs entering through the mouth and throat."], "Білезікте тамыр соғуы осы артериядан саналады.": ["По этой артерии на запястье считают пульс.", "The pulse at the wrist is counted on this artery."], "Бас сүйегінің төбесі мен бүйірін құрап, миды қорғайды.": ["Образует свод и бока черепа, защищает мозг.", "Forms the top and sides of the skull and protects the brain."], "Тізе буынын алдынан қорғайды.": ["Защищает коленный сустав спереди.", "Protects the knee joint at the front."], "Жауырынды алға-төмен тартады.": ["Тянет лопатку вперёд и вниз.", "Pulls the shoulder blade forward and down."], "Санды бүгеді, жүргенде аяқты алға шығарады.": ["Сгибает бедро, выносит ногу вперёд при ходьбе.", "Bends the hip and swings the leg forward when walking."], "Белді тұрақтандырады, денені жанға еңкейтеді.": ["Стабилизирует поясницу, наклоняет туловище в сторону.", "Steadies the lower back and bends the trunk sideways."], "Денені алға бүгеді, ішкі мүшелерді ұстап тұрады.": ["Сгибает туловище вперёд, удерживает внутренние органы.", "Bends the trunk forward and holds the internal organs in."], "Тізені жазады; тұру, жүру, секіруге қатысады.": ["Разгибает колено; участвует в стоянии, ходьбе, прыжках.", "Straightens the knee; used in standing, walking and jumping."], "Жауырынды омыртқаға қарай тартады.": ["Тянет лопатку к позвоночнику.", "Pulls the shoulder blade toward the spine."], "Сан мен тізені бүгеді; денедегі ең ұзын бұлшықет.": ["Сгибает бедро и колено; самая длинная мышца тела.", "Bends the hip and knee; the longest muscle in the body."], "Денедегі ең жуан жүйке; аяқтың артқы бұлшықеттері мен терісін жүйкелендіреді.": ["Самый толстый нерв тела; иннервирует задние мышцы и кожу ноги.", "The thickest nerve in the body; supplies the back muscles and skin of the leg."], "Жауырынды кеудеге жабыстырып, алға жылжытады.": ["Прижимает лопатку к грудной клетке и двигает её вперёд.", "Holds the shoulder blade against the chest and moves it forward."], "Аяқ басын төмен бүгеді, тік тұруды қамтамасыз етеді.": ["Сгибает стопу вниз, помогает стоять прямо.", "Points the foot down and helps you stand upright."], "Бас сүйегі негізінің ортасында; гипофиз осы сүйектің ойығында жатады.": ["В центре основания черепа; гипофиз лежит в углублении этой кости.", "In the middle of the skull base; the pituitary sits in a hollow of this bone."], "Тамақты жұтқыншақтан асқазанға жылжытады.": ["Продвигает пищу из глотки в желудок.", "Moves food from the throat to the stomach."], "Қабақты жабады.": ["Закрывает веко.", "Closes the eyelid."], "Ас қорыту ферменттерін және қандағы қантты реттейтін инсулинді бөледі.": ["Выделяет пищеварительные ферменты и инсулин, регулирующий сахар крови.", "Releases digestive enzymes and insulin, which controls blood sugar."], "Ұйқы мен сергектік ырғағын реттейтін мелатонин бөледі.": ["Выделяет мелатонин, регулирующий ритм сна и бодрствования.", "Releases melatonin, which controls the sleep–wake rhythm."], "Шәуеттің сұйық бөлігін түзеді.": ["Образует жидкую часть спермы.", "Makes the fluid part of semen."], "Білектің бас бармақ жағындағы сүйегі; білекті бұруға мүмкіндік береді.": ["Кость предплечья со стороны большого пальца; позволяет вращать предплечье.", "Forearm bone on the thumb side; lets the forearm rotate."], "Несепті жинап, несепағарға өткізеді.": ["Собирает мочу и передаёт её в мочеточник.", "Collects urine and passes it to the ureter."], "Қанды оттегімен байыту үшін өкпеге айдайды.": ["Перекачивает кровь в лёгкие для насыщения кислородом.", "Pumps blood to the lungs to take in oxygen."], "Омыртқа жотасын жамбаспен жалғап, салмақты аяққа береді.": ["Соединяет позвоночник с тазом и передаёт вес на ноги.", "Joins the spine to the pelvis and passes weight to the legs."], "Қолды кеудемен байланыстырады; иық бұлшықеттері бекиді.": ["Связывает руку с грудной клеткой; к ней крепятся мышцы плеча.", "Connects the arm to the chest; shoulder muscles attach to it."], "Көз алмасының пішінін сақтап, қорғайды.": ["Сохраняет форму глазного яблока и защищает его.", "Keeps the eyeball's shape and protects it."], "Қанды сүзеді, ескі қан жасушаларын ыдыратады, иммунитетке қатысады.": ["Фильтрует кровь, разрушает старые клетки крови, участвует в иммунитете.", "Filters blood, breaks down old blood cells and supports immunity."], "Басты бұрады және алға еңкейтеді.": ["Поворачивает и наклоняет голову вперёд.", "Turns the head and tilts it forward."], "Тамақты қышқыл сөлмен өңдеп, қорытуды бастайды.": ["Обрабатывает пищу кислым соком и начинает пищеварение.", "Treats food with acid juice and starts digestion."], "Адреналин мен кортизол гормондарын бөледі.": ["Выделяет гормоны адреналин и кортизол.", "Releases the hormones adrenaline and cortisol."], "Сирақ пен аяқ басын жалғайды.": ["Соединяет голень и стопу.", "Connects the lower leg to the foot."], "Ішінде есту және тепе-теңдік мүшелері орналасқан.": ["Внутри находятся органы слуха и равновесия.", "Holds the organs of hearing and balance."], "Төменгі жақты көтеріп, артқа тартады.": ["Поднимает нижнюю челюсть и тянет её назад.", "Lifts the lower jaw and pulls it back."], "Шәует жасушалары мен тестостерон түзеді.": ["Вырабатывает сперматозоиды и тестостерон.", "Produces sperm and testosterone."], "Сезім сигналдарын ми қыртысына бағыттайды.": ["Направляет сенсорные сигналы в кору мозга.", "Relays sensory signals to the cerebral cortex."], "Көмейдің ең үлкен шеміршегі; дауыс желбезектерін қорғайды.": ["Самый крупный хрящ гортани; защищает голосовые связки.", "The largest cartilage of the larynx; protects the vocal cords."], "Зат алмасу мен өсуді реттейтін гормондар бөледі.": ["Выделяет гормоны, регулирующие обмен веществ и рост.", "Releases hormones that control metabolism and growth."], "Сирақтың негізгі салмақ көтеретін сүйегі.": ["Основная опорная кость голени.", "The main weight-bearing bone of the lower leg."], "Дәмді сезеді, тамақты араластырады, сөйлеуге қатысады.": ["Чувствует вкус, перемешивает пищу, участвует в речи.", "Tastes, mixes food and helps speech."], "Ауаны көмейден бронхтар арқылы өкпеге өткізеді.": ["Проводит воздух из гортани через бронхи в лёгкие.", "Carries air from the larynx through the bronchi to the lungs."], "Іш қабырғасын тартып, ішкі қысымды ұстайды.": ["Напрягает брюшную стенку, поддерживает внутреннее давление.", "Tightens the abdominal wall and keeps internal pressure."], "Дыбыс толқынынан тербеліп, оны есту сүйекшелеріне береді.": ["Колеблется от звуковых волн и передаёт их слуховым косточкам.", "Vibrates with sound waves and passes them to the ear bones."], "Несепті бүйректен қуыққа өткізеді.": ["Проводит мочу из почки в мочевой пузырь.", "Carries urine from the kidney to the bladder."], "Несепті қуықтан сыртқа шығарады.": ["Выводит мочу из мочевого пузыря наружу.", "Carries urine out of the bladder."], "Несепті жинап, сыртқа шығарады.": ["Собирает мочу и выводит её наружу.", "Stores urine and releases it."], "Жүрек, өкпе және ас қорыту мүшелерінің жұмысын реттейді.": ["Регулирует работу сердца, лёгких и органов пищеварения.", "Regulates the heart, lungs and digestive organs."], "Лимфа тініне бай; қабынса аппендицит болады.": ["Богат лимфоидной тканью; при воспалении развивается аппендицит.", "Rich in lymphoid tissue; when inflamed, it causes appendicitis."], "Басты ұстап тұрады, мойынды қозғалтады, жұлынды қорғайды.": ["Держит голову, двигает шеей, защищает спинной мозг.", "Holds the head, moves the neck and protects the spinal cord."], "Дененің негізгі салмағын көтереді; еңкею мен бұрылуға мүмкіндік береді.": ["Держит основной вес тела; позволяет наклоняться и поворачиваться.", "Carries most of the body's weight; allows bending and turning."], "Қабырғалар бекиді; жұлынды қорғайды.": ["К ним крепятся рёбра; защищают спинной мозг.", "The ribs attach here; protects the spinal cord."], "Есту және тепе-теңдік сигналдарын миға жеткізеді.": ["Передаёт сигналы слуха и равновесия в мозг.", "Carries hearing and balance signals to the brain."], "Бастың қозғалысы мен тепе-теңдікті сезеді.": ["Чувствует движения головы и равновесие.", "Senses head movement and balance."], "Көз алмасының ішін толтырып, пішінін сақтайды.": ["Заполняет глазное яблоко и сохраняет его форму.", "Fills the eyeball and keeps its shape."], "Мұрын пердесінің төменгі-артқы бөлігін құрайды.": ["Образует нижнюю заднюю часть носовой перегородки.", "Forms the lower back part of the nasal septum."], "Ми бөліктерін өзара байланыстыратын жүйке талшықтары.": ["Нервные волокна, соединяющие отделы мозга.", "Nerve fibres connecting parts of the brain."], "Беттің пішінін береді, көз ұясын бүйірінен қорғайды.": ["Формирует контур лица, защищает глазницу сбоку.", "Shapes the face and protects the eye socket from the side."], "Ауыз бұрышын көтереді (күлімсіреу).": ["Поднимает уголок рта (улыбка).", "Lifts the corner of the mouth (smile)."]}, IDX = {ru:0, en:1   if (state.tab==="regions") state.region ? regionDetail() : regionList();
  else state.doctor ? doctorDetail() : doctorList();
  panel.scrollTop = keepScroll ? st : 0;
}
function regionList(){
  const ul = el("ol",{class:"list"});
  REGIONS.forEach((r,i)=>{
    const b = el("button",{class:"row",type:"button",on:{click:()=>select({region:r.id})}});
    b.append(el("span",{class:"n",text:String(i+1).padStart(2,"0")}));
    const t = el("span"); t.append(el("b",{text:r.name}), el("small",{text:r.sub})); b.append(t);
    ul.append(el("li",null,b));
  });
  panel.append(el("p",{class:"lead",text:"Аймақты тізімнен немесе модельден таңдаңыз. Ішкі құрылымдары мен олардың қызметі ашылады."}), ul, note());
}
function partButton(regionId, it){
  const open = state.region===regionId && state.part===it.key;
  const b = el("button",{class:"part",type:"button","aria-expanded":String(open),"data-key":it.key,on:{click:()=>{state.tab="regions";select({region:regionId, part: open?null:it.key}, true);}}});
  b.append(el("b",{text:it.k}), el("em",{text:it.n}));
  const fn = META.fn[it.f]; if (fn) b.append(el("span",{class:"fn",text:fn}));
  const who = whoText(it.d); if (who) b.append(el("span",{class:"who",text:"Емдейтін дәрігер: "+who}));
  return b;
}
function regionDetail(){
  const r = regionById[state.region];
  panel.append(el("button",{class:"back",type:"button",text:"← Барлық аймақтар",on:{click:()=>select({})}}));
  panel.append(el("h2",{text:r.name}), el("p",{class:"lead",text:r.lead}));
  const inp = el("input",{class:"search",id:"q",type:"search",placeholder:"Құрылымды іздеу (қазақша немесе латынша)","aria-label":"Құрылымды іздеу"});
  inp.value = state.q;
  inp.addEventListener("input",()=>{ state.q = inp.value; fill(); });
  panel.append(inp);
  const box = el("div"); box.style.display="flex"; box.style.flexDirection="column"; box.style.gap="12px"; panel.append(box);
  function fill(){
    box.textContent = "";
    const q = state.q.trim().toLowerCase();
    const selLayer = state.part ? state.part.split("|")[0] : null;
    LAYER_ORDER.forEach(layer=>{
      let items = (INDEX[r.id]||{})[layer]||[];
      if (!items.length) return;
      if (q) items = items.filter(it=>it.k.toLowerCase().includes(q) || it.n.toLowerCase().includes(q));
      if (!items.length) return;
      const d = el("details"); if (q || selLayer===layer || (!selLayer && layer==="organ") || (!selLayer && layer==="bone" && !(INDEX[r.id]||{}).organ)) d.open = true;
      const s = el("summary"); const dot = el("i"); dot.style.background="var(--"+layer+")"; s.append(dot, layerName[layer], el("span",{text:String(items.length)})); d.append(s);
      const wrap = el("div",{class:"items"}); items.forEach(it=>wrap.append(partButton(r.id,it))); d.append(wrap); box.append(d);
    });
    if (!box.children.length) box.append(el("p",{class:"lead",text:"Ештеңе табылмады."}));
  }
  fill();
  let bits = 0; LAYER_ORDER.forEach(l=>((INDEX[r.id]||{})[l]||[]).forEach(it=>bits|=it.d));
  panel.append(el("h3",{text:"Осы аймақты қарайтын дәрігерлер"}));
  const chips = el("div",{class:"chips"});
  DOCTORS.filter(d=>bits & docBit[d.id]).forEach(d=>chips.append(el("button",{class:"chip",type:"button",text:d.name,on:{click:()=>select({doctor:d.id})}})));
  panel.append(chips, note());
}
function doctorList(){
  const ul = el("ol",{class:"list"});
  DOCTORS.forEach((d,i)=>{
    const b = el("button",{class:"row",type:"button",on:{click:()=>select({doctor:d.id})}});
    b.append(el("span",{class:"n",text:String(i+1).padStart(2,"0")}));
    const t = el("span"); t.append(el("b",{text:d.name}), el("small",{text:d.text})); b.append(t);
    ul.append(el("li",null,b));
  });
  panel.append(el("p",{class:"lead",text:"Дәрігерді таңдаңыз. Ол емдейтін құрылымдар модельде бөлек көрсетіледі."}), ul, note());
}
function doctorDetail(){
  const d = DOCTORS.find(x=>x.id===state.doctor), bit = docBit[d.id];
  panel.append(el("button",{class:"back",type:"button",text:"← Барлық дәрігерлер",on:{click:()=>select({})}}));
  panel.append(el("h2",{text:d.name}), el("p",{class:"lead",text:d.text}));
  REGIONS.forEach(r=>{
    const items = [];
    LAYER_ORDER.forEach(l=>((INDEX[r.id]||{})[l]||[]).forEach(it=>{ if (it.d & bit) items.push(it); }));
    if (!items.length) return;
    panel.append(el("h3",{text:r.name+" · "+items.length}));
    if (items.length > 40 || d.id==="gyn" || d.id==="derm") {
      const b = el("button",{class:"part",type:"button",on:{click:()=>select({region:r.id})}});
      b.append(el("b",{text:items.length+" құрылым"}), el("em",{text:"Аймақты ашып, тізімін көру"}));
      panel.append(b);
    } else items.forEach(it=>panel.append(partButton(r.id,it)));
  });
  panel.append(note());
}
function select(s, keep){
  const prevRegion = state.region;
  state.region = s.region||null; state.part = s.part||null; state.doctor = s.doctor||null;
  if (state.region !== prevRegion) state.q = "";
  if (state.region) state.tab = "regions";
  if (state.doctor) state.tab = "doctors";
  if ((state.doctor==="derm" || state.doctor==="gyn") && !state.layers.skin) { state.layers.skin = true; renderLayers(); }
  renderPanel(keep && prevRegion===state.region);
  if (state.part) { const b = panel.querySelector('.part[aria-expanded="true"]'); if (b) b.scrollIntoView({block:"nearest"}); }
  apply(!(keep && prevRegion===state.region));
  if (window.__mcBridge) window.__mcBridge(state);
}
$("tab-regions").addEventListener("click",()=>{state.tab="regions";state.doctor=null;renderPanel();apply(true);});
$("tab-doctors").addEventListener("click",()=>{state.tab="doctors";state.region=null;state.part=null;renderPanel();apply(true);});
$("reset").addEventListener("click",()=>select({}));
function apply(refocus){ if (scene3d) scene3d.apply(refocus); }

// ------------------------------------------------------------------ 3D
function init3d(buffer){
  const canvas = $("view"), stage = $("stage"), tip = $("tip");
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 50);
  camera.position.set(0.8, 1.1, 3.9);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 0.9, 0); controls.enableDamping = true; controls.minDistance = 0.12; controls.maxDistance = 8;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4860, 0.85));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.8); d1.position.set(2,3,4); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0xc8d8ff, 0.5); d2.position.set(-3,2,-4); scene.add(d2);
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ACC = [242,179,94];

  // ---- decode binary into one geometry per (region, layer)
  const u16 = new Uint16Array(buffer);
  const lo = META.lo, sc = [0,1,2].map(i=>(META.hi[i]-META.lo[i])/65535);
  let cur = 0;
  const groups = META.groups.map(g=>{
    let V=0, I=0; g.parts.forEach(p=>p.p.forEach(q=>{V+=q[0]; I+=q[1];}));
    const pos = new Float32Array(V*3), col = new Uint8Array(V*3), idx = new Uint32Array(I);
    let v=0, i=0;
    g.parts.forEach(p=>{
      p.v0 = v; p.i0 = i;
      p.p.forEach(q=>{
        const vc=q[0], ic=q[1], c=META.pal[q[2]];
        for (let k=0;k<vc;k++){ const o=(v+k)*3, s=cur+k*3; pos[o]=lo[0]+u16[s]*sc[0]; pos[o+1]=lo[1]+u16[s+1]*sc[1]; pos[o+2]=lo[2]+u16[s+2]*sc[2]; col[o]=c[0]; col[o+1]=c[1]; col[o+2]=c[2]; }
        cur += vc*3;
        for (let k=0;k<ic;k++) idx[i+k] = u16[cur+k] + v;
        cur += ic; v += vc; i += ic;
      });
      p.v1 = v; p.i1 = i;
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
    geo.setIndex(new THREE.BufferAttribute(idx,1));
    geo.computeVertexNormals();
    geo.computeBoundingBox();
    const base = col.slice();
    const colAttr = new THREE.BufferAttribute(col,3,true);
    geo.setAttribute("color", colAttr);
    function sub(transparent){
      const gg = new THREE.BufferGeometry();
      gg.setAttribute("position", geo.getAttribute("position")); gg.setAttribute("normal", geo.getAttribute("normal")); gg.setAttribute("color", colAttr);
      const arr = new Uint32Array(I); gg.setIndex(new THREE.BufferAttribute(arr,1)); gg.setDrawRange(0,0);
      gg.boundingBox = geo.boundingBox; gg.boundingSphere = geo.boundingBox.getBoundingSphere(new THREE.Sphere());
      const mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.62, metalness:0, side:THREE.DoubleSide, transparent, opacity:transparent?0.1:1, depthWrite:!transparent});
      const mesh = new THREE.Mesh(gg, mat); mesh.renderOrder = transparent ? (g.l==="skin"?3:2) : 0; mesh.userData = {g:null, segs:[]};
      scene.add(mesh); return mesh;
    }
    const G = {r:g.r, l:g.l, parts:g.parts, idx, base, col, colAttr, box:geo.boundingBox, main:sub(false), ghost:sub(true)};
    G.main.userData.g = G; G.ghost.userData.g = G;
    return G;
  });
  $("msg").style.display = "none";

  function fillMesh(mesh, G, list){
    const arr = mesh.geometry.index.array; let n=0; const segs=[];
    list.forEach(p=>{ segs.push([n,p]); arr.set(G.idx.subarray(p.i0,p.i1), n); n += p.i1-p.i0; });
    mesh.geometry.index.needsUpdate = true; mesh.geometry.setDrawRange(0,n); mesh.userData.segs = segs; mesh.userData.count = n;
    mesh.visible = n>0;
  }
  function paint(G, hiKey){
    const c = G.col, b = G.base; c.set(b);
    if (hiKey) G.parts.forEach(p=>{ if (p.key!==hiKey) return; for (let o=p.v0*3;o<p.v1*3;o+=3){ c[o]=(b[o]*0.35+ACC[0]*0.65)|0; c[o+1]=(b[o+1]*0.35+ACC[1]*0.65)|0; c[o+2]=(b[o+2]*0.35+ACC[2]*0.65)|0; } });
    G.colAttr.needsUpdate = true;
  }
  let focusAnim = null;
  function focus(box, dir){
    if (box.isEmpty()) return;
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x, s.y, s.z) * 0.5 + 0.04;
    const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    const half = THREE.MathUtils.degToRad(camera.fov/2);
    const dist = r / Math.tan(half) / Math.min(1, aspect) * 1.2;
    const to = c.clone().add(dir.clone().normalize().multiplyScalar(dist));
    if (reduce) { camera.position.copy(to); controls.target.copy(c); return; }
    focusAnim = {t0:performance.now(), p0:camera.position.clone(), p1:to, q0:controls.target.clone(), q1:c};
  }
  function partBox(G, p, box){
    const pos = G.main.geometry.getAttribute("position").array, v = new THREE.Vector3();
    for (let o=p.v0*3;o<p.v1*3;o+=3){ v.set(pos[o],pos[o+1],pos[o+2]); box.expandByPoint(v); }
  }
  function applyState(refocus){
    const bit = state.doctor ? docBit[state.doctor] : 0;
    const whole = state.doctor==="ped";
    const fbox = new THREE.Box3();
    groups.forEach(G=>{
      const on = !!state.layers[G.l], skin = G.l==="skin";
      let main = [], ghost = [], gop = 0.07, hi = null;
      if (!on) { /* hidden layer */ }
      else if (state.doctor && !whole) {
        G.parts.forEach(p=>((p.d & bit) ? main : ghost).push(p)); gop = skin ? 0.05 : 0.06;
        if (main.length && state.doctor!=="derm" && state.doctor!=="card" && state.doctor!=="neuro") main.forEach(p=>partBox(G,p,fbox));
      } else if (state.region) {
        if (G.r===state.region) {
          if (skin) { ghost = G.parts; gop = 0.08; }
          else if (state.part) { G.parts.forEach(p=>(p.key===state.part ? main : ghost).push(p)); gop = 0.22; hi = state.part; }
          else main = G.parts;
          fbox.union(G.box);
        } else { ghost = G.parts; gop = skin ? 0.05 : 0.07; }
      } else {
        if (skin) { ghost = G.parts; gop = 0.32; } else main = G.parts;
      }
      paint(G, hi);
      fillMesh(G.main, G, main); fillMesh(G.ghost, G, ghost);
      G.ghost.material.opacity = gop;
    });
    if (refocus) {
      if (state.region) {
        const back = state.region==="back" || state.region==="lumbar";
        const side = state.region.endsWith("_r") ? -0.45 : state.region.endsWith("_l") ? 0.45 : 0.25;
        const box = new THREE.Box3(); groups.forEach(G=>{ if (G.r===state.region) box.union(G.box); });
        focus(box, new THREE.Vector3(side, 0.12, back?-1:1));
      } else if (state.doctor && !fbox.isEmpty()) focus(fbox, new THREE.Vector3(0.3,0.12,1));
      else { const box = new THREE.Box3(); groups.forEach(G=>box.union(G.box)); focus(box, new THREE.Vector3(0.2,0.06,1)); }
    }
  }

  // ---- picking
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function partAt(mesh, faceIndex){
    const segs = mesh.userData.segs, i = faceIndex*3; let a=0, b=segs.length-1;
    while (a<b){ const m=(a+b+1)>>1; if (segs[m][0]<=i) a=m; else b=m-1; }
    return segs.length ? segs[a][1] : null;
  }
  function pick(ev, cheap){
    const r = canvas.getBoundingClientRect();
    ptr.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ptr, camera);
    const mains = [], ghosts = [];
    groups.forEach(G=>{
      if (cheap && state.region && G.r!==state.region) return;
      if (G.main.visible) mains.push(G.main);
      if (!cheap && G.ghost.visible && G.l!=="skin") ghosts.push(G.ghost);
    });
    let hit = ray.intersectObjects(mains, false)[0];
    if (!hit && !cheap) hit = ray.intersectObjects(ghosts, false)[0];
    if (!hit) return null;
    const G = hit.object.userData.g;
    return {G, part: partAt(hit.object, hit.faceIndex)};
  }
  let down = null;
  canvas.addEventListener("pointerdown", e=>{ down = {x:e.clientX, y:e.clientY}; });
  canvas.addEventListener("pointerup", e=>{
    if (!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 6) return;
    const h = pick(e, false); if (!h) return;
    state.tab = "regions";
    if (state.region===h.G.r && h.part) select({region:h.G.r, part:h.part.key}, true);
    else select({region:h.G.r});
  });
  let lastMove = 0;
  canvas.addEventListener("pointermove", e=>{
    if (e.buttons || e.pointerType==="touch") { tip.style.display="none"; return; }
    const now = performance.now(); if (now-lastMove < 110) return; lastMove = now;
    if (!state.region) { tip.style.display="none"; canvas.style.cursor="pointer"; return; }
    const h = pick(e, true);
    if (!h || !h.part) { tip.style.display = "none"; canvas.style.cursor = ""; return; }
    const r = stage.getBoundingClientRect();
    tip.textContent = h.part.k + " · " + h.part.n + SIDE[h.part.s];
    tip.style.left = Math.min(e.clientX-r.left, r.width-260)+"px"; tip.style.top = (e.clientY-r.top)+"px"; tip.style.display = "block";
    canvas.style.cursor = "pointer";
  });
  canvas.addEventListener("pointerleave", ()=>{ tip.style.display = "none"; });

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();
  applyState(true);
  (function loop(){
    requestAnimationFrame(loop);
    if (focusAnim) {
      const k = Math.min(1, (performance.now()-focusAnim.t0)/550), e = k*k*(3-2*k);
      camera.position.lerpVectors(focusAnim.p0, focusAnim.p1, e); controls.target.lerpVectors(focusAnim.q0, focusAnim.q1, e);
      if (k>=1) focusAnim = null;
    }
    controls.update(); renderer.render(scene, camera);
  })();
  return {apply:applyState};
}

renderLayers(); renderPanel();
(function(){ var m = location.hash.match(/region=(\w+)/); if (m && regionById[m[1]]) select({region:m[1]}); })();
window.addEventListener('hashchange', function(){ var m = location.hash.match(/region=(\w+)/); if (m && regionById[m[1]] && state.region !== m[1]) select({region:m[1]}); });
function start(buf){ try { scene3d = init3d(buf); } catch (e) { $("msg").style.display="flex"; $("msg").textContent = "3D көрініс іске қосылмады: " + e.message; } }
if (!(window.THREE && THREE.OrbitControls)) {
  $("msg").textContent = "3D кітапхана жүктелмеді. Интернет байланысын тексеріп, бетті қайта ашыңыз.";
} else if (ATLAS_B64.length > 100) {
  const bin = atob(ATLAS_B64), buf = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  start(buf.buffer);
} else {
  fetch("atlas.bin").then(r=>{ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(start)
    .catch(e=>{ $("msg").textContent = "Модель файлы (atlas.bin) жүктелмеді: " + e.message; });
}
</script>
